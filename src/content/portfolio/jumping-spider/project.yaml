description: This is a model of a male jumping spider created for the University of
  Cincinnati for studying mating dances of male jumping spiders. The initial geometry
  was created from a CT-scan of a preserved jumping spider and I was tasked with creating
  a full animation-ready model from the source materials. Jer Bot (twitter.com/jerbotnet)
  helped with creation of the initial 3D body mesh and rigging.
