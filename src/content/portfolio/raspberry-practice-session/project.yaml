description: I recently shaded this Raspberry in Cycles for the ongoing challenge
  over at shaders.xyz I learned a fair bit about working with Subsurface Scattering,
  Translucency, and strand rendering. Three things I rarely work with while shading
  most things. I also spent some time perfecting the final comp render to better match
  the reference by tweaking the color and adding photographic phenomenon including
  Chromatic aberration, Film Grain and vignetting. I also opted for a bit lighter
  of a raspberry than in the reference per personal taste. Although the raw render
  matches the reference a little closer.
